<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virasat – Legal Heir Helper</title>
<style>
  :root{--maroon:#8b1a1f;--gold:#dc9f4a;--cream:#faf6ec;--ink:#2a2220;--card:#fff;--ok:#2e7d32;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari",Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink);font-size:18px;line-height:1.5}
  header{background:var(--maroon);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  header h1{margin:0;font-size:22px}
  header small{opacity:.85;display:block;font-size:13px}
  .lang button{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:6px 10px;font-size:15px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--maroon);font-weight:700}
  main{max-width:640px;margin:0 auto;padding:16px}
  .bar{height:8px;background:#e8dfcc;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar div{height:100%;background:var(--gold);transition:width .3s}
  .card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
  h2{margin:0 0 6px;color:var(--maroon);font-size:21px}
  p{margin:6px 0}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e3d8c0;border-radius:12px;padding:14px;margin:8px 0;font-size:18px;cursor:pointer}
  .opt:hover,.opt:focus{border-color:var(--gold)}
  .opt.sel{border-color:var(--maroon);background:#fbeeee}
  .btn{background:var(--maroon);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-size:18px;cursor:pointer;margin:6px 6px 0 0}
  .btn.alt{background:#fff;color:var(--maroon);border:2px solid var(--maroon)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .speak{float:right;background:#fff;border:2px solid var(--gold);border-radius:99px;padding:6px 12px;font-size:15px;cursor:pointer}
  label.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0e8d6}
  label.chk input{width:24px;height:24px;margin-top:2px;accent-color:var(--maroon);flex:none}
  input[type=text]{width:100%;padding:12px;font-size:18px;border:2px solid #e3d8c0;border-radius:10px;margin:4px 0 10px}
  textarea{width:100%;min-height:300px;padding:12px;font-size:16px;border:2px solid #e3d8c0;border-radius:10px;font-family:inherit}
  .note{background:#fff6dd;border-left:5px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:15px}
  .tag{display:inline-block;background:#fbeeee;color:var(--maroon);border-radius:99px;padding:2px 10px;font-size:13px;margin-bottom:6px}
  a{color:var(--maroon);word-break:break-all}
  footer{max-width:640px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:#6b5f55}
  @media print{header,.bar,.nav,.speak,footer,.noprint{display:none!important}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div><h1>Virasat · विरासत</h1><small id="sub"></small></div>
  <div class="lang"><button id="bhi" onclick="setLang('hi')">हिंदी</button> <button id="ben" onclick="setLang('en')">English</button></div>
</header>
<main>
  <div class="bar"><div id="prog"></div></div>
  <div id="view"></div>
</main>
<footer id="foot"></footer>

 },

  q1:"Did their Demat account or mutual funds have a nominee?",
  q1o:[["yes","Yes, there was a nominee"],["no","No nominee"],["unk","Not sure"]],

  q2o:[["yes","Yes"],["no","No"],["unk","Not sure"]],

  q4o:[["spouse","Husband / Wife"],["child","Son / Daughter"],["other","Other relative"]],
  resT:"Your checklist",
  resP:"These steps are based on your answers. Tick each one when done.",
  g_docs:"1. Gather documents",
  g_find:"2. Find the investments",
  g_claim:"3. Make the claim",
  g_help:"4. If there is delay or refusal",

const LINKS=[
 ["IEPF – Unclaimed dividends & shares","https://www.iepf.gov.in"],
 ["SEBI SCORES – Complaints","https://scores.sebi.gov.in"],
 ["NSDL","https://nsdl.co.in"],
 ["CDSL","https://www.cdslindia.com"],
 ["MFCentral – Mutual funds","https://www.mfcentral.com"],
 ["Cyber crime (if you suspect fraud)","https://cybercrime.gov.in"]
];

// ---------- State (memory only; nothing saved) ----------
let lang="hi", step=0, ans={}, ticks={}, form={};
const STEPS=6; // 0 welcome,1-4 q,5 results,6 letter,7 links

function t(){return T[lang]}
function setLang(l){lang=l;document.documentElement.lang=l;render()}
function speak(txt){
  if(!("speechSynthesis" in window)){alert("Voice not supported on this device");return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang=lang==="hi"?"hi-IN":"en-IN";u.rate=.9;speechSynthesis.speak(u);
}
function say(id){speak(document.getElementById(id).innerText)}
function go(n){step=n;speechSynthesis&&speechSynthesis.cancel();render();window.scrollTo(0,0)}
function pick(k,v){ans[k]=v;render()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function question(k,qkey,okey,prevStep,nextStep){
  const o=t()[okey];
  return `<div class="card" id="qc"><button class="speak" onclick="say('qc')">${t().speak}</button>
   <h2>${t()[qkey]}</h2>
   ${o.map(([v,l])=>`<button class="opt ${ans[k]===v?'sel':''}" onclick="pick('${k}','${v}')">${l}</button>`).join("")}
   </div>
   <div class="nav"><button class="btn alt" onclick="go(${prevStep})">${t().back}</button>
   <button class="btn" ${ans[k]?'':'disabled'} onclick="go(${nextStep})">${t().next}</button></div>`;
}

function checklist(){
  const L=t(); const g=[];
  const docs=[["d_death"],["d_id"],["d_rel"]];
  if(ans.q2==="yes"||ans.q2==="unk")docs.push(["d_will"]);
  if(ans.q1==="yes")docs.push(["d_noms"]);
  if(ans.q1!=="yes")docs.push(["d_legal"]);
  g.push(["g_docs",docs]);
  const find=[];
  if(ans.q3!=="know"){find.push(["f_mail"],["f_cas"]);}
  find.push(["f_mf"],["f_iepf"]);
  if(ans.q3==="know")find.unshift(["f_cas"]);
  g.push(["g_find",find]);
  const claim=[ans.q1==="yes"?["c_nom"]:["c_nonom"],["c_letter"],["c_note"]];
  g.push(["g_claim",claim]);
  g.push(["g_help",[["h_dp"],["h_scores"],["h_comp"]]]);
  return g;
}
function allKeys(){return checklist().flatMap(([,items])=>items.map(i=>i[0]))}
function tick(k){ticks[k]=!ticks[k];render()}

function render(){
  const L=t();
  document.getElementById("sub").textContent=L.sub;
  document.getElementById("foot").textContent=L.foot;
  document.getElementById("bhi").className=lang==="hi"?"on":"";
  document.getElementById("ben").className=lang==="en"?"on":"";
  const v=document.getElementById("view");
  let html="";
  if(step===0){
    html=`<div class="card" id="wc"><button class="speak" onclick="say('wc')">${L.speak}</button>
      <h2>${L.welcomeT}</h2><p>${L.welcomeP}</p><p class="note">${L.welcomeN}</p></div>
      <button class="btn" onclick="go(1)">${L.start}</button>`;
  } else if(step===1) html=question("q4","q4","q4o",0,2);
  else if(step===2) html=question("q1","q1","q1o",1,3);
  else if(step===3) html=question("q2","q2","q2o",2,4);
  else if(step===4) html=question("q3","q3","q3o",3,5);
  else if(step===5){
    const keys=allKeys(), done=keys.filter(k=>ticks[k]).length;
    html=`<div class="card" id="rc"><button class="speak" onclick="say('rc')">${L.speak}</button>
      <h2>${L.resT}</h2><p>${L.resP}</p>
      <p><b>${L.done}: ${done}/${keys.length}</b></p>
      ${checklist().map(([g,items])=>`<h2 style="font-size:18px;margin-top:14px">${L[g]}</h2>`+items.map(([k])=>`<label class="chk"><input type="checkbox" ${ticks[k]?'checked':''} onchange="tick('${k}')"><span>${L[k]}</span></label>`).join("")).join("")}
      </div>
      <p class="note">${L.warn}</p>
      <div class="nav"><button class="btn alt" onclick="go(4)">${L.back}</button>
      <button class="btn" onclick="go(6)">${L.letterBtn}</button>
      <button class="btn alt" onclick="go(7)">${L.resBtn}</button></div>`;
  } else if(step===6){
    const fields=[["me","f1"],["dec","f2"],["rel","f3"],["dp","f4"],["id","f5"],["date","f6"]];
    html=`<div class="card"><h2>${L.lt}</h2><p>${L.lp}</p>
      ${fields.map(([k,l])=>`<label>${L[l]}<input type="text" value="${esc(form[k]||"")}" oninput="form['${k}']=this.value"></label>`).join("")}
      <button class="btn" onclick="genLetter()">${L.gen}</button></div>
      <div id="out"></div>
      <div class="nav"><button class="btn alt" onclick="go(5)">${L.back}</button></div>`;
  } else if(step===7){
    html=`<div class="card" id="lc"><button class="speak" onclick="say('lc')">${L.speak}</button><h2>${L.rt}</h2><p>${L.rp}</p>
      ${LINKS.map(([n,u])=>`<p>🔗 <b>${n}</b><br><a href="${u}" target="_blank" rel="noopener">${u}</a></p>`).join("")}</div>
      <div class="nav"><button class="btn alt" onclick="go(5)">${L.back}</button></div>`;
  }
  v.innerHTML=html;
  document.getElementById("prog").style.width=Math.min(100,Math.round(step/7*100))+"%";
}
function genLetter(){
  const txt=t().letter(form);
  document.getElementById("out").innerHTML=`<div class="card"><textarea id="lt">${esc(txt)}</textarea>
   <button class="btn" onclick="copyL()" id="cb">${t().copy}</button>
   <button class="btn alt" onclick="window.print()">${t().print}</button></div>`;
  document.getElementById("out").scrollIntoView({behavior:"smooth"});
}
function copyL(){
  const ta=document.getElementById("lt");ta.select();
  (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.resolve(document.execCommand("copy")))
   .then(()=>{document.getElementById("cb").textContent=t().copied});
}
render();
</script>
</body>
</html>
